<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jimmy's</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #353535;
      }

      .logo-screen {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #353535;
      }

      .logo {
        width: 100vw;
        height: 100vh;
        display: block;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <main class="logo-screen" aria-label="Jimmy's logo">
      <img class="logo" src="../assets/jimmys-logo2025.png" alt="Jimmy's">
    </main>
  </body>
</html>

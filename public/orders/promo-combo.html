<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Combo Meal Promo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
        background: #ffffff;
      }

      .promo {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(18px, 3.8vh, 32px) clamp(18px, 5vw, 34px) clamp(10px, 2vh, 18px);
        background:
          linear-gradient(180deg, rgba(255, 248, 235, 0.16) 0%, rgba(255, 255, 255, 0) 42%),
          url("../assets/combo_bg2.png");
        background-repeat: no-repeat;
        background-position: center, center bottom;
        background-size: cover, 100% 100%;
      }

      .text {
        position: relative;
        z-index: 5;
        color: #09131f;
        flex: 0 0 auto;
        text-align: center;
      }

      .line {
        width: min(100%, 340px);
        margin: clamp(14px, 2.2vh, 22px) auto 0;
        color: #ffffff;
        font-size: clamp(21px, 6.4vw, 30px);
        line-height: 1.06;
        font-weight: 900;
        text-shadow: 0 1px 0 #00205b, 1px 0 0 #00205b, 0 -1px 0 #00205b, -1px 0 0 #00205b;
      }

      .headline {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: clamp(52px, 8vh, 72px);
        max-width: 100%;
        margin: 0;
        padding: 0 clamp(18px, 5vw, 28px);
        border-radius: 8px;
        background: #00205b;
        color: #ffffff;
        font-size: clamp(30px, 8.5vw, 44px);
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        box-shadow: 0 14px 28px rgba(0, 32, 91, 0.22);
        animation: tilePulse 4s ease-in-out infinite;
      }

      .headline::after {
        content: "";
        position: absolute;
        top: -44%;
        bottom: -44%;
        left: -76%;
        width: 42%;
        background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.14) 32%, rgba(255, 255, 255, 0.82) 50%, rgba(255, 255, 255, 0.14) 68%, transparent 100%);
        transform: rotate(12deg);
        animation: shine 4s ease-in-out infinite;
      }

      .deal {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: clamp(14px, 2.4vh, 24px);
      }

      .price {
        position: relative;
        display: inline-block;
        padding: 0;
        border: 0;
        border-radius: 0;
        overflow: visible;
        background: transparent;
        color: #00205b;
        font-family: "Source Sans Variable", "Source Sans 3", "Source Sans Pro", Arial, Helvetica, sans-serif;
        font-size: clamp(54px, 14.5vw, 78px);
        line-height: 0.95;
        font-weight: 900;
        letter-spacing: 0;
        text-shadow: none;
        -webkit-text-stroke: 0;
        overflow: hidden;
        animation: pricePop 4s ease-in-out infinite;
      }

      .price::after {
        content: "";
        position: absolute;
        top: -24%;
        bottom: -24%;
        left: -46%;
        width: 32%;
        background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.16) 26%, rgba(255, 255, 255, 0.72) 50%, rgba(255, 255, 255, 0.16) 74%, transparent 100%);
        transform: rotate(12deg);
        animation: priceShine 4s ease-in-out infinite;
      }

      @keyframes shine {
        0%,
        8% {
          left: -75%;
        }

        38% {
          left: 130%;
        }

        39%,
        100% {
          left: 130%;
        }
      }

      @keyframes tilePulse {
        0%,
        8%,
        38%,
        100% {
          transform: scale(1);
        }

        23% {
          transform: scale(1.02);
        }
      }

      @keyframes pricePop {
        0%,
        45%,
        90%,
        100% {
          transform: scale(1);
        }

        68% {
          transform: scale(1.045);
        }
      }

      @keyframes priceShine {
        0%,
        45% {
          left: -46%;
        }

        82% {
          left: 116%;
        }

        83%,
        100% {
          left: 116%;
        }
      }

      @media (min-aspect-ratio: 4 / 3) {
        .promo {
          display: grid;
          grid-template-columns: minmax(300px, 0.72fr) minmax(480px, 1.28fr);
          align-items: center;
          padding: clamp(28px, 5vh, 58px) clamp(28px, 5vw, 72px);
          background:
            linear-gradient(90deg, rgba(255, 248, 235, 0.16) 0%, rgba(255, 255, 255, 0) 44%),
            url("../assets/combo_bg2.png");
          background-repeat: no-repeat;
          background-position: center, center bottom;
          background-size: cover, 100% 100%;
        }

        .text {
          flex: none;
        }

        .line {
          width: min(100%, 540px);
          margin-top: clamp(20px, 3vh, 34px);
          font-size: clamp(24px, 3vw, 40px);
          line-height: 1.08;
        }

        .headline {
          min-height: 76px;
          padding: 0 34px;
          font-size: clamp(42px, 5vw, 72px);
        }

        .deal {
          gap: 14px;
          margin-top: clamp(20px, 3vh, 34px);
        }

        .price {
          padding: 0;
          font-size: clamp(64px, 7.5vw, 104px);
          box-shadow: none;
        }

      }
    </style>
  </head>
  <body>
    <section class="promo" aria-label="Combo meal ajánlat">
      <div class="text">
        <h1 class="headline">Combo Meal</h1>
        <div class="deal">
          <strong class="price">3 690 Ft</strong>
        </div>
        <p class="line">Kebab, sültkrumpli és 0,33l dobozos üdítő</p>
      </div>
    </section>
  </body>
</html>

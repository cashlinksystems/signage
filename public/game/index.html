<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nyereményjáték TV</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="slide-stage">
      <iframe id="menuFrame" class="slide menu-slide" src="/menu/" title="Menütábla"></iframe>

      <section id="promoSlide" class="slide promo-slide" aria-label="Nyereményjáték">
        <img class="promo-logo" src="/assets/jimmys-logo2025.png" alt="Jimmy's Kebab">

        <div class="promo-phone-stage" aria-hidden="true">
          <div class="promo-phone">
            <img class="phone-image" src="/assets/iphone17pro-cutout.png" alt="">
          </div>
          <div class="sparkle sparkle-1">✦</div>
          <div class="sparkle sparkle-2">✦</div>
          <div class="sparkle sparkle-3">✦</div>
          <div class="sparkle sparkle-4">✦</div>
        </div>

        <h1 class="promo-title">Nyerj egy<br>iPhone 17 Pro-t<br>a Jimmy's-nél!</h1>
        <p class="promo-subtitle">Harapj. Kaparj. Nyerj.</p>
        <p class="promo-cta">Részletek a kasszánál!</p>
      </section>
    </div>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
